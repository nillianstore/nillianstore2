name: Social Media Automation Bot

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  
jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Build Eleventy site
        run: npm run build
        
      - name: Wait for Netlify Deployment
        run: |
          echo "Waiting for Netlify to deploy..."
          sleep 30
          echo "Proceeding with social media posting..."

  post:
    runs-on: ubuntu-latest
    needs: validate-site
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-frontmatter requests

      - name: Debug - Check Secrets
        run: |
          echo "Checking if secrets are configured..."
          [ -n "$GROQ_API_KEY" ] && echo "✓ GROQ_API_KEY is set" || echo "✗ GROQ_API_KEY is MISSING"
          [ -n "$META_ACCESS_TOKEN" ] && echo "✓ META_ACCESS_TOKEN is set" || echo "✗ META_ACCESS_TOKEN is MISSING"
          [ -n "$FB_PAGE_ID" ] && echo "✓ FB_PAGE_ID is set" || echo "✗ FB_PAGE_ID is MISSING"
          [ -n "$IG_USER_ID" ] && echo "✓ IG_USER_ID is set" || echo "✗ IG_USER_ID is MISSING"
          [ -n "$GITHUB_TOKEN" ] && echo "✓ GITHUB_TOKEN is set" || echo "✗ GITHUB_TOKEN is MISSING"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Images Are Accessible
        run: |
          echo "Verifying website images are accessible..."
          curl -s -I https://www.nillianstore.com/img/B0G2LKSCGR.webp | head -1
          echo ""
          echo "Website verification complete."

      - name: Run Social Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Starting social bot..."
          python social_bot.py
          echo "Social bot completed successfully!"

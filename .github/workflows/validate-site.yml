name: Validate site build

on:
  # Disabled: `npm ci` fails because package-lock.json is not committed to the
  # repo (and is gitignored). build-check.yml covers CI builds.
  # Trigger manually via the Actions tab ("Run workflow") when needed.
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - name: Check generated filenames
        run: node scripts/check-filenames.js
